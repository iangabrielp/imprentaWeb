<div class="product-card" (click)="openProductDetail()">
  <div class="product-image">
    <img [src]="product.image" [alt]="product.name" loading="lazy">
    <div class="product-image-overlay"></div>
    <div class="product-badge" [class.out-of-stock]="product.stock === 0" *ngIf="product.stock !== undefined">
      {{ product.stock > 0 ? 'En stock' : 'Agotado' }}
    </div>
  </div>

  <div class="product-content">
    <div class="product-category" *ngIf="product.category">
      <mat-icon>label</mat-icon> {{ product.category }}
    </div>
    <h3>{{ product.name }}</h3>
    <p>{{ product.description | slice:0:100 }}{{ product.description.length > 100 ? '...' : '' }}</p>
  </div>

  <div class="product-footer">
    <div class="product-price">
      ${{ product.price }}
    </div>
    <button class="product-btn" (click)="$event.stopPropagation(); openProductDetail()">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>
</div>
