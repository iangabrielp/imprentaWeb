<div class="service-card" (click)="openServiceDetail()">
  <div class="service-image">
    <img [src]="service.image" [alt]="service.name" loading="lazy">
    <div class="service-image-overlay"></div>
    <div class="service-badge" *ngIf="service.priceFrom">
      Desde ${{ service.priceFrom }}
    </div>
  </div>

  <div class="service-content">
    <h3>{{ service.name }}</h3>
    <p>{{ service.description | slice:0:120 }}{{ service.description.length > 120 ? '...' : '' }}</p>
    <div class="service-features" *ngIf="service.features && service.features.length > 0">
      <span *ngFor="let feature of service.features.slice(0, 3)" class="feature-tag">
        <mat-icon>check_circle</mat-icon> {{ feature }}
      </span>
    </div>
  </div>

  <div class="service-action">
    <button class="service-btn" (click)="$event.stopPropagation(); openServiceDetail()">
      <span>Ver detalles</span>
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>
</div>
