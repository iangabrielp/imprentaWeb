<section class="services-section" id="servicios">
  <div class="container">
    <div class="section-header" data-reveal>
      <span class="section-badge">Servicios</span>
      <h2>Nuestros Servicios</h2>
      <p>Soluciones gráficas adaptadas a tus necesidades. Calidad y profesionalismo en cada proyecto.</p>
    </div>

    <div class="services-grid" *ngIf="!loading; else loadingTemplate">
      <app-service-card
        *ngFor="let service of services; let i = index"
        [service]="service"
        class="stagger-item"
        [style.--stagger-index]="i"
      ></app-service-card>
    </div>

    <div class="services-cta" *ngIf="!loading" data-reveal>
      <a routerLink="/servicios" class="btn-glow">
        Ver todos los servicios
        <mat-icon>arrow_forward</mat-icon>
      </a>
    </div>

    <ng-template #loadingTemplate>
      <div class="loading-spinner">
        <mat-spinner diameter="50"></mat-spinner>
        <p>Cargando servicios...</p>
      </div>
    </ng-template>

    <div *ngIf="!loading && services.length === 0" class="no-services">
      <p>No hay servicios disponibles en este momento.</p>
    </div>
  </div>
</section>
