<header class="header" [class.scrolled]="isScrolled">
  <div class="header-container">
    <a routerLink="/" class="logo">
      <img src="assets/images/services/logo1.jpg" alt="Imprenta Web" class="logo-img">
      <span class="logo-text">Estudio<span class="highlight">Creativo</span></span>
    </a>

    <nav class="desktop-nav">
      <a *ngFor="let item of navItems" [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        {{ item.label }}
      </a>
    </nav>

    <div class="actions">
      <a routerLink="/login" class="login-btn">
        <mat-icon>login</mat-icon>
        <span class="login-text">Login</span>
      </a>
      <button class="menu-toggle" (click)="toggleMenu()" [class.open]="isMenuOpen" aria-label="Toggle menu">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
  </div>
</header>

<div class="mobile-menu" [class.open]="isMenuOpen">
  <a *ngFor="let item of navItems" [routerLink]="item.link" (click)="toggleMenu()" routerLinkActive="active">
    {{ item.label }}
  </a>
  <a routerLink="/login" (click)="toggleMenu()" class="mobile-login-btn">
    <mat-icon>login</mat-icon> Login
  </a>
</div>

<div class="mobile-overlay" [class.visible]="isMenuOpen" (click)="toggleMenu()"></div>
